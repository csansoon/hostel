name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test-unit
      - name: Build all targets
        run: |
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/hostel
          done

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Cache the pinned mise binaries
        uses: actions/cache@v4
        with:
          path: dist/mise-linux-*
          key: mise-linux-${{ hashFiles('build/mise-checksums.txt') }}
      - name: E2E tests
        run: make test-e2e

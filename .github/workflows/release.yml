name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Build and sign the release files
        env:
          HOSTEL_RELEASE_KEY: ${{ secrets.HOSTEL_RELEASE_KEY }}
        run: |
          test -n "$HOSTEL_RELEASE_KEY" || { echo "the secret HOSTEL_RELEASE_KEY is missing" >&2; exit 1; }
          test "$(git describe --tags --always --dirty)" = "$GITHUB_REF_NAME" || { echo "the tag is not on the checked-out commit" >&2; exit 1; }
          make release
          test -s dist/release/SHA256SUMS.sig
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "$GITHUB_REF_NAME" --generate-notes
